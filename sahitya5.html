<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neelamb - Blogger HD News Generator & Print</title>
    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js"></script>
    <style>
        :root { --fb-red: #ed1c24; --fb-blue: #002e5b; --fb-yellow: #ffcc00; }
        body { background: #f0f2f5; margin: 0; padding: 0; font-family: 'Mukta', sans-serif; touch-action: manipulation; overflow-x: hidden; }
        
        #gh-outer-wrapper { width: 100%; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding-bottom: 30px; box-sizing: border-box; }

        .gh-main-layout {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: flex-start;
            gap: 20px;
            width: 100%;
            max-width: 1700px;
            padding: 20px;
            box-sizing: border-box;
        }

        .gh-preview-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-grow: 1;
            width: 100%;
            max-width: 1100px;
            overflow: hidden;
        }

        .gh-controls-panel { 
            background: #fff; padding: 20px; border-radius: 12px;
            width: 360px; min-width: 360px; display: flex; flex-direction: column; gap: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1); border: 1px solid #ddd;
            position: sticky; top: 20px; z-index: 1000; box-sizing: border-box;
        }

        .control-block { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; background: #f1f3f4; padding: 8px 12px; border-radius: 8px; border: 1px solid #ddd; font-weight: bold; font-size: 13px; color: #333; width: 100%; box-sizing: border-box; }
        .control-block label { font-size: 11px; color: #555; text-transform: uppercase; letter-spacing: 0.5px; }
        .control-block select, .control-block input[type="range"], .control-block input[type="text"] { width: 100%; box-sizing: border-box; }
        
        #gh-master-container { 
            transform-origin: top center; 
            margin: 10px 0; 
            transition: transform 0.1s ease; 
            display: flex;
            justify-content: center;
        }

        .gh-master-wrap { 
            width: 1600px; height: 1600px; 
            background: #000; border: 25px solid var(--fb-red); 
            box-sizing: border-box; position: relative;
            overflow: hidden; box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }
        
        .gh-inner-border { position: absolute; inset: 15px; border: 3px solid rgba(255, 255, 255, 0.4); pointer-events: none; z-index: 25; }
        
        .gh-domain-ribbon { 
            position: absolute; top: -2px; left: 50%; transform: translateX(-50%);
            background: var(--fb-red); color: #fff; padding: 10px 80px;
            font-size: 28px; font-weight: 800; z-index: 35; border-radius: 0 0 20px 20px;
        }

        .draggable-item { position: absolute; z-index: 100; cursor: move; touch-action: none; }
        .gh-logo-watermark { width: 350px; height: auto; object-fit: contain; pointer-events: none; }
        .gh-img-frame { position: absolute; inset: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; background: #000; }
        .main-photo { position: absolute; will-change: transform; cursor: move; touch-action: none; }

        .gh-social-icons { display: flex; flex-direction: column; gap: 20px; padding: 20px; }
        .gh-social-icons img { width: 70px; height: 70px; border-radius: 50%; border: 3px solid #fff; }

        .gh-headline { 
            width: 100%; text-align: center; font-weight: 800; line-height: 1.2;
            background: transparent; padding: 10px;
            text-shadow: 4px 4px 15px rgba(0,0,0,1);
            outline: none; cursor: text;
        }
        .word-white { color: #ffffff; }
        .word-yellow { color: var(--fb-yellow); }

        .gh-content-box {
            width: 100%; font-weight: 600; line-height: 1.5;
            color: #ffffff; background: rgba(0, 0, 0, 0.6); padding: 20px 30px;
            border-radius: 12px; font-size: 28px; text-shadow: 2px 2px 8px rgba(0,0,0,0.9);
            border: 2px solid rgba(255,255,255,0.2);
            box-sizing: border-box;
            outline: none;
            cursor: text;
            text-align: left;
        }
        .gh-content-box p { margin: 0 0 10px 0; }
        .gh-content-box br { display: block; content: ""; margin-top: 5px; }

        .gh-nav-row { display: flex; gap: 10px; width: 100%; margin-bottom: 5px; }
        .gh-nav-btn { flex: 1; background: var(--fb-red); color: #fff; padding: 10px; border: none; font-weight: bold; cursor: pointer; border-radius: 6px; font-size: 15px; box-shadow: 0 3px 8px rgba(237, 28, 36, 0.3); transition: background 0.2s; display: flex; align-items: center; justify-content: center; gap: 5px; }
        .gh-nav-btn:hover { background: #d0151c; }
        .gh-nav-btn:disabled { background: #ccc; cursor: not-allowed; box-shadow: none; }
        
        .gh-footer { margin-top: auto; padding: 15px; width: 100%; text-align: center; background: #fff; border-top: 1px solid #ddd; font-weight: bold; color: #555; }

        .action-buttons-group { display: flex; gap: 8px; width: 100%; margin-top: 2px; }
        .action-buttons-group button { flex: 1; padding: 9px 6px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; color: white; display: flex; align-items: center; justify-content: center; gap: 4px; font-size: 12px; }

        @media (max-width: 1150px) {
            .gh-main-layout { flex-direction: column-reverse; align-items: center; }
            .gh-controls-panel { width: 100%; max-width: 800px; position: static; }
        }

        @media print {
            body * { visibility: hidden; }
            #captureArea, #captureArea * { visibility: visible; }
            #captureArea { position: absolute; left: 0; top: 0; transform: none !important; box-shadow: none !important; }
            .gh-domain-ribbon { display: none !important; }
        }
    </style>
</head>
<body>

<div id="gh-outer-wrapper">
    <div class="gh-main-layout">
        <!-- बायाँतर्फ प्रिभ्यू सेक्सन -->
        <div class="gh-preview-section">
            <div id="gh-master-container"></div>
        </div>

        <!-- दायाँतर्फ कन्ट्रोल प्यानल -->
        <div class="gh-controls-panel">
            <div class="gh-nav-row" id="ghNavRowContainer"></div>

            <div class="control-block">
                <label>Format Size</label>
                <select id="formatSelector" onchange="changeFormat()" style="padding: 6px; border-radius: 4px; border: 1px solid #ccc; font-family: 'Mukta';">
                    <option value="fb-landscape" data-w="1200" data-h="630">Facebook Landscape (1200x630)</option>
                    <option value="fb-square" data-w="1200" data-h="1200">Facebook Square (1200x1200)</option>
                    <option value="fb-hd-square" data-w="1600" data-h="1600" selected>Facebook HD Square (1600x1600)</option>
                    <option value="ig-portrait" data-w="1080" data-h="1350">Instagram Portrait (1080x1350)</option>
                    <option value="ig-square" data-w="1080" data-h="1080">Instagram Square (1080x1080)</option>
                    <option value="yt-thumb" data-w="1280" data-h="720">YouTube Thumbnail (1280x720)</option>
                    <option value="story-reel" data-w="1080" data-h="1920">Stories / Reels (1080x1920)</option>
                </select>
            </div>

            <div class="control-block">
                <label>Image Resize (फोटो सानो/ठूलो)</label>
                <input type="range" id="imgZoom" min="0.1" max="5" step="0.1" value="1.0" oninput="applyTransform()">
            </div>
            
            <div class="control-block">
                <label>Headline Resize (टेक्स्ट साइज)</label>
                <input type="range" id="headlineSize" min="40" max="180" step="1" value="100" oninput="adjustHeadline()">
            </div>

            <div class="control-block">
                <label>Headline Width (हेडलाइन चौडाइ: <span id="headlineWidthLabel">95</span>%)</label>
                <input type="range" id="headlineWidthRange" min="40" max="100" step="1" value="95" oninput="adjustHeadlineWidth()">
            </div>

            <div class="control-block">
                <label>Content Word Count (शब्द संख्या सीमा: <span id="wordCountLabel">70</span> शब्द)</label>
                <input type="range" id="contentLengthRange" min="20" max="250" step="10" value="70" oninput="updateContentLength()">
            </div>

            <div class="control-block">
                <label>Content Text Size (कन्टेन्ट फन्ट साइज)</label>
                <input type="range" id="contentTextSize" min="16" max="60" step="1" value="28" oninput="adjustContentFontSize()">
            </div>

            <div class="control-block">
                <label>Content Width (कन्टेन्ट चौडाइ: <span id="contentWidthLabel">90</span>%)</label>
                <input type="range" id="contentWidthRange" min="40" max="100" step="1" value="90" oninput="adjustContentWidth()">
            </div>

            <div class="control-block">
                <label>Text Alignment (पाठको स्थान)</label>
                <select id="textAlignSelector" onchange="adjustTextAlign()" style="padding: 6px; border-radius: 4px; border: 1px solid #ccc; font-family: 'Mukta';">
                    <option value="left">Left (बायाँतर्फ)</option>
                    <option value="center" selected>Center (बीचमा)</option>
                    <option value="right">Right (दायाँतर्फ)</option>
                </select>
            </div>

            <!-- यहाँबाट रातो पटीमा देखिने नाम (Fixed Ribbon Text) लाई सीधै परिवर्तन गर्न सकिन्छ -->
            <div class="control-block">
                <label>Ribbon Text / Site Name (रातो पटीको नाम)</label>
                <input type="text" id="inputRibbonText" value="मेरो साहिित्य डट कम" oninput="updateRibbonText()" style="padding: 6px; border-radius: 4px; border: 1px solid #ccc; font-family: 'Mukta'; font-weight: bold;">
            </div>

            <div class="control-block">
                <label>Blogger Feed URL (डेटा ल्याउने साइटको लिङ्क)</label>
                <input type="text" id="inputDomain" value="www.sahitya.me" style="padding: 6px; border-radius: 4px; border: 1px solid #ccc; font-family: 'Mukta';">
            </div>

            <div class="control-block">
                <label>Logo Image Link Add</label>
                <input type="text" id="inputLogo" value="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjPSa1Jt5325YTKOibuuPKws_lVfbyjlsBDIzkNvojJlmCkdtAX96jN87p22ZeS8cCQZHgxcgdtEWVO6HxrzwiuhffnFotHdwQnBebkRktAPpqx7OySs0DUMHtDoVmKTQJE5m-KJIrRg5HBH_6G7Rm7gM_yTn2B-ERta7oDh0CtGjbYzrubh0G-eNbu1ga1/s400-rw/logo-400%20copy.png" style="padding: 6px; border-radius: 4px; border: 1px solid #ccc; font-family: 'Mukta';">
            </div>

            <div class="action-buttons-group">
                <button onclick="updateSettings()" style="background: var(--fb-blue);">
                    <i class="fas fa-sync-alt"></i> Update
                </button>
                <button onclick="capturePNG(2)" style="background: #28a745;">
                    <i class="fas fa-download"></i> HD Save
                </button>
                <button onclick="printCard()" style="background: #e83e8c;">
                    <i class="fas fa-print"></i> Print
                </button>
            </div>
        </div>
    </div>

    <div class="gh-footer">
        Copyright &copy; 2026 | Designed by <a href="https://neelamb.com" target="_blank" style="color: var(--fb-red); text-decoration: none;"><b>Neelamb.com</b></a>
    </div>
</div>

<script>
let gh_posts_data = [];
let gh_current_idx = 0;
let imgState = { x: 0, y: 0, scale: 1 };
let SITE_DOMAIN = "www.sahitya.me";
let SITE_LOGO_URL = "https://blogger.googleusercontent.com/img/a/AVvXsEgYs0647clgoWQC3ORQwtqpad0VDIrBI79h63NovgIKr29srh_C19HJk7OCbTquzxfofL7huTIp7wDCgE9W9fo_cmqE31j8GIm9B6ePJZU1pAEa5pnfTl7aB27FJjw7Vo8gk0327lNtNrurlgqSpRwSRRQIpC4gVvN9KdgtsDoXDYM8ZdfNB-IYHSmiaw=s200";

function getBloggerHD(url) {
    if (!url) return '';
    return url.replace(/\/s[0-9]+(-[a-z0-9-]+)?\//, '/s1600/')
              .replace(/\/w[0-9]+-h[0-9]+(-[a-z0-9-]+)?\//, '/s1600/')
              .split('=s')[0] + '=s1600';
}

function initInteract() {
    interact('.draggable-item').draggable({
        inertia: true,
        listeners: {
            move(event) {
                const target = event.target;
                const x = (parseFloat(target.getAttribute('data-x')) || 0) + event.dx;
                const y = (parseFloat(target.getAttribute('data-y')) || 0) + event.dy;
                target.style.transform = `translate(${x}px, ${y}px)`;
                target.setAttribute('data-x', x);
                target.setAttribute('data-y', y);
            }
        }
    });
    interact('.main-photo').draggable({
        listeners: { move(event) { imgState.x += event.dx; imgState.y += event.dy; applyTransform(); } }
    });
}

function applyTransform() {
    const img = document.getElementById('mainImg');
    if(!img) return;
    imgState.scale = document.getElementById('imgZoom').value;
    img.style.transform = `translate(${imgState.x}px, ${imgState.y}px) scale(${imgState.scale})`;
}

function adjustHeadline() {
    const headline = document.getElementById('ghHeadline');
    if (headline) headline.style.fontSize = document.getElementById('headlineSize').value + "px";
}

function adjustHeadlineWidth() {
    const widthVal = document.getElementById('headlineWidthRange').value;
    document.getElementById('headlineWidthLabel').innerText = widthVal;
    const group = document.getElementById('headlineGroup');
    if (group) group.style.width = widthVal + "%";
}

function adjustContentWidth() {
    const widthVal = document.getElementById('contentWidthRange').value;
    document.getElementById('contentWidthLabel').innerText = widthVal;
    const group = document.getElementById('contentGroup');
    if (group) group.style.width = widthVal + "%";
}

function adjustContentFontSize() {
    const contentEl = document.getElementById('ghContentText');
    if (contentEl) contentEl.style.fontSize = document.getElementById('contentTextSize').value + "px";
}

function adjustTextAlign() {
    const alignVal = document.getElementById('textAlignSelector').value;
    const contentEl = document.getElementById('ghContentText');
    if (contentEl) contentEl.style.textAlign = alignVal;
}

function updateRibbonText() {
    const customText = document.getElementById('inputRibbonText').value;
    const ribbon = document.getElementById('ribbonTextContent');
    if (ribbon) ribbon.innerText = customText;
}

function formatHeadline(text) {
    if (!text) return '';
    const words = text.split(' ');
    const totalWords = words.length;
    if (totalWords <= 1) return `<span class="word-white">${text}</span>`;
    
    const halfIndex = Math.floor(totalWords / 2);
    const firstHalf = words.slice(0, halfIndex).join(' ');
    const secondHalf = words.slice(halfIndex).join(' ');
    
    return `<span class="word-white">${firstHalf}</span> <span class="word-yellow">${secondHalf}</span>`;
}

function getFormattedContentHTML(htmlContent, limit) {
    if (!htmlContent) return '';
    let tempDiv = document.createElement("div");
    tempDiv.innerHTML = htmlContent;
    
    let scripts = tempDiv.querySelectorAll('script, style');
    scripts.forEach(s => s.remove());
    
    let fullText = tempDiv.textContent || tempDiv.innerText || "";
    let words = fullText.trim().split(/\s+/);
    
    if (words.length <= limit) {
        return tempDiv.innerHTML;
    } else {
        let wordCount = 0;
        function traverseAndTrim(node) {
            if (node.nodeType === Node.TEXT_NODE) {
                let nodeWords = node.nodeValue.trim().split(/\s+/);
                if (wordCount + nodeWords.length >= limit) {
                    let allowedWordsCount = limit - wordCount;
                    node.nodeValue = nodeWords.slice(0, allowedWordsCount).join(' ') + '...';
                    wordCount = limit;
                } else {
                    wordCount += nodeWords.length;
                }
            } else {
                for (let i = 0; i < node.childNodes.length; i++) {
                    if (wordCount >= limit) {
                        node.childNodes[i].remove();
                        i--;
                    } else {
                        traverseAndTrim(node.childNodes[i]);
                    }
                }
            }
        }
        traverseAndTrim(tempDiv);
        return tempDiv.innerHTML;
    }
}

function updateContentLength() {
    const limit = document.getElementById('contentLengthRange').value;
    document.getElementById('wordCountLabel').innerText = limit;
    const p = gh_posts_data[gh_current_idx];
    if(p && p.content) {
        const contentEl = document.getElementById('ghContentText');
        if(contentEl) {
            contentEl.innerHTML = getFormattedContentHTML(p.content.$t, parseInt(limit));
        }
    }
}

function changeFormat() {
    const sel = document.getElementById('formatSelector');
    const opt = sel.options[sel.selectedIndex];
    const wrap = document.querySelector('.gh-master-wrap');
    if(wrap) {
        wrap.style.width = opt.getAttribute('data-w') + 'px';
        wrap.style.height = opt.getAttribute('data-h') + 'px';
    }
    adjustScale();
}

function updateDisplay() {
    const container = document.getElementById('gh-master-container');
    const navContainer = document.getElementById('ghNavRowContainer');
    const p = gh_posts_data[gh_current_idx];
    if(!p) return;

    const title = p.title.$t;
    const contentHTML = p.content ? p.content.$t : '';
    const thumb = p.media$thumbnail ? getBloggerHD(p.media$thumbnail.url) : '';
    const wordLimit = document.getElementById('contentLengthRange').value || 70;
    const contentFontSize = document.getElementById('contentTextSize').value || 28;
    const headlineW = document.getElementById('headlineWidthRange').value || 95;
    const contentW = document.getElementById('contentWidthRange').value || 90;
    const textAlign = document.getElementById('textAlignSelector').value || 'center';
    const ribbonText = document.getElementById('inputRibbonText').value || 'साहित्य डट कम';
    
    imgState = { x: 0, y: 0, scale: 1 };

    container.innerHTML = `
        <div class="gh-master-wrap" id="captureArea">
            <div class="gh-domain-ribbon" id="ribbonTextContent">${ribbonText}</div>
            <div class="gh-inner-border"></div>

            <div class="gh-img-frame">
                <img src="https://images.weserv.nl/?url=${encodeURIComponent(thumb.replace('https://',''))}" class="main-photo" id="mainImg">
            </div>

            <div class="draggable-item" style="top: 40px; right: 30px;">
                <img src="https://images.weserv.nl/?url=${encodeURIComponent(SITE_LOGO_URL.replace('https://',''))}" class="gh-logo-watermark">
            </div>

            <div class="draggable-item gh-social-icons" style="top: 100px; left: 20px;">
                <img src="https://cdn-icons-png.flaticon.com/512/733/733547.png">
                <img src="https://cdn-icons-png.flaticon.com/512/3046/3046121.png">
                <img src="https://cdn-icons-png.flaticon.com/512/1384/1384060.png">
                <img src="https://cdn-icons-png.flatic0n.com/512/733/733585.png">
            </div>

            <div class="draggable-item" id="headlineGroup" style="top: 60px; left: 50%; transform: translateX(-50%); width: ${headlineW}%; text-align: center;">
                <div class="gh-headline" id="ghHeadline" contenteditable="true">
                    ${formatHeadline(title)}
                </div>
            </div>

            <div class="draggable-item" id="contentGroup" style="bottom: 40px; left: 50%; transform: translateX(-50%); width: ${contentW}%; display: flex; justify-content: center;">
                <div class="gh-content-box" id="ghContentText" contenteditable="true" style="font-size: ${contentFontSize}px; text-align: ${textAlign};">
                    ${getFormattedContentHTML(contentHTML, parseInt(wordLimit))}
                </div>
            </div>
        </div>
    `;

    navContainer.innerHTML = `
        <button class="gh-nav-btn" onclick="move(-1)" ${gh_current_idx === 0 ? 'disabled' : ''}>&larr; Previous</button>
        <button class="gh-nav-btn" onclick="move(1)" ${gh_current_idx === gh_posts_data.length - 1 ? 'disabled' : ''}>Next &rarr;</button>
    `;

    const imgEl = document.getElementById('mainImg');
    if(imgEl) {
        imgEl.onload = () => { 
            initInteract(); 
            changeFormat(); 
            adjustHeadline(); 
            adjustContentFontSize();
            applyTransform();
        };
    }
}

function adjustScale() {
    const container = document.getElementById('gh-master-container');
    const wrap = document.querySelector('.gh-master-wrap');
    if(!wrap) return;
    const targetWidth = parseInt(wrap.style.width) || 1600;
    const targetHeight = parseInt(wrap.style.height) || 1600;
    
    const previewSectionWidth = document.querySelector('.gh-preview-section').clientWidth - 20;
    const scale = Math.min(1, previewSectionWidth / targetWidth);
    container.style.transform = `scale(${scale})`;
    container.style.marginBottom = `-${targetHeight * (1 - scale)}px`;
}

async function capturePNG(scaleMultiplier = 2) {
    const container = document.getElementById('gh-master-container');
    const target = document.getElementById('captureArea');
    const originalTransform = container.style.transform;
    
    const ribbon = target.querySelector('.gh-domain-ribbon');
    const originalDisplay = ribbon ? ribbon.style.display : '';
    if (ribbon) ribbon.style.display = 'none';

    window.scrollTo(0,0);
    container.style.transform = "scale(1)";
    setTimeout(async () => {
        try {
            const canvas = await html2canvas(target, { useCORS: true, scale: scaleMultiplier });
            const link = document.createElement('a');
            link.download = `hd-news-card-${Date.now()}.png`;
            link.href = canvas.toDataURL("image/png");
            link.click();
        } catch (e) { alert("Error saving image."); }
        finally { 
            container.style.transform = originalTransform; 
            if (ribbon) ribbon.style.display = originalDisplay;
        }
    }, 500);
}

function printCard() {
    window.print();
}

function updateSettings() {
    const d = document.getElementById('inputDomain').value.trim().replace(/^https?:\/\//, '').replace(/\/$/, '');
    const l = document.getElementById('inputLogo').value.trim();
    
    if(d) SITE_DOMAIN = d;
    if(l) SITE_LOGO_URL = l;

    const callbackName = `ghCB_${Math.random().toString(36).substr(2, 5)}`;
    window[callbackName] = (data) => {
        gh_posts_data = data.feed.entry || [];
        if (gh_posts_data.length > 0) {
            gh_current_idx = 0;
            updateDisplay();
        } else {
            alert("No posts found!");
        }
    };

    const script = document.createElement('script');
    script.src = `https://${SITE_DOMAIN}/feeds/posts/default?alt=json-in-script&callback=${callbackName}&max-results=50`;
    document.head.appendChild(script);
}

window.move = (n) => { gh_current_idx += n; updateDisplay(); };
window.addEventListener('resize', adjustScale);

updateSettings();
</script>
</body>
</html>
